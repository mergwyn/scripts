kopiacmd:
  - --help
  - --version
  - repo
  - system
  - users
  - policy
  - completion

kopiacmd repo:
  - create
  - connect
  - list
  - valid

kopiacmd repo create:
  - $(kopiacmd repo valid kopia)

kopiacmd repo connect:
  - $(ls ~/.config/kopia/*.config 2>/dev/null | sed -e 's:.*/::' -e 's/.config$//')

kopiacmd repo valid:
  - kopia
  - velero

kopiacmd repo valid kopia:
  - $(kopiacmd repo valid kopia)

kopiacmd repo valid velero:
  - $(kopiacmd repo valid velero)

kopiacmd system:
  - install
  - certs

kopiacmd system install:
  - $(ls ~/.config/kopia/*.config 2>/dev/null | sed -e 's:.*/::' -e 's/.config$//')

kopiacmd system certs:
  - $(ls ~/.config/kopia/*.config 2>/dev/null | sed -e 's:.*/::' -e 's/.config$//')

kopiacmd users:
  - add

kopiacmd users add:
  - $(ls ~/.config/kopia/*.config 2>/dev/null | sed -e 's:.*/::' -e 's/.config$//')

kopiacmd policy:
  - global
  - path

kopiacmd policy global:
  - $(ls ~/.config/kopia/*.config 2>/dev/null | sed -e 's:.*/::' -e 's/.config$//')

kopiacmd policy path:
  - $(kopiacmd repo valid)

kopiacmd completion:
  - generate
